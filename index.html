<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Практика 3</title>
<style>
  :root { --bg:#eef3f1; --ink:#16302b; --card:#ffffff; --accent:#1f7a6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 24px; }
  img { width:100%; height:auto; border-radius:12px; display:block; margin-bottom:24px; }
  .field { background:var(--card); border-left:6px solid var(--accent); padding:16px 20px; margin-bottom:14px; border-radius:6px; font-size:1.1rem; }
</style>
</head>
<body>
<main>
  <h1>Сайт работает!</h1>
  <img alt="Это сайт на облаке" src="photo.jpg">
  <div class="field">Баханович М.Д.</div>
  <div class="field">Из группы БСБО-13-23</div>
  <div class="field">Шифр - X..XX02</div>
</main>
</body>
</html>
